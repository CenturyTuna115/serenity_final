    - assets/johndoe.jpg
    - assets/smith.png
    - assets/leaf.png
    - assets/icon/icon.png
    - assets/audio/Breathingdemo.mp3
    - assets/audio/audio3.mp3
    - assets/animation/developer.json
    - assets/animation/calm.json
    - assets/animation/snail.json
    - assets/audio/ringtone.mp3
    - assets/gesture/river.jpg
    - assets/gesture/birds.jpg
    - assets/gesture/breath.png

  uses-material-design: true

flutter_icons:
  android: true
  image_path: "assets/icon/icon.png"
