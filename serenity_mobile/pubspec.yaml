name: serenity_mobile
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.1.6+1
  cupertino_icons: ^1.0.6
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  sensors_plus: ^5.0.1
  audioplayers: ^6.0.0
  shake: ^1.0.1
  fl_chart: ^0.68.0
  flutter_webrtc: ^0.8.0
  provider: ^6.0.2
  fluttertoast: ^8.2.6
  firebase_database: ^11.0.4
  url_launcher: ^6.3.0
  contacts_service: ^0.6.3
  permission_handler: ^11.3.1
  intl: ^0.19.0
  flutter_launcher_icons: ^0.13.1
  telephony: ^0.2.0
  firebase_messaging: ^15.0.4
  lottie: ^3.1.2
  agora_rtc_engine: ^6.0.0
  http: ^1.2.2
  flutter_sound: ^9.26.0
  file_picker: ^6.1.2
  path_provider: ^2.1.1
  firebase_storage: ^12.1.3
  shared_preferences: ^2.2.2
  cloud_functions: ^5.0.4
  flutter_local_notifications: ^19.0.0
  logging: ^1.2.0
  flutter_foreground_task: ^8.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
